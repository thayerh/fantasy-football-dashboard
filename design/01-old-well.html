<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction 1 — Old Well</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="argyle.css">
<style>
/* ===========================================================================
   DIRECTION 1 — "Old Well": editorial collegiate

   Reference points: a printed game program, a university viewbook, the
   Daily Tar Heel masthead. Authority comes from typography and rules, not
   from shadows and cards.

   Type: Libre Franklin — an open-source revival of Franklin Gothic, which is
   UNC's actual display face. Open Sans is the brand's body face and is free.
   Choosing these is why it reads as Carolina rather than as Generic Blue App.
   ========================================================================= */
*{box-sizing:border-box}
body{
  margin:0; background:var(--unc-white); color:var(--text-strong);
  font-family:"Open Sans",system-ui,sans-serif; font-size:var(--step-0);
  line-height:1.5;
}
.wrap{max-width:60rem;margin:0 auto;padding:0 var(--space-5)}

/* Argyle as a narrow masthead rule, not wallpaper. A 10px band reads as a
   ribbon; a full-bleed field would overwhelm the content. */
.masthead-band{height:16px}

header{border-bottom:3px solid var(--unc-navy);padding:var(--space-6) 0 var(--space-4)}
.eyebrow{
  font-family:"Libre Franklin",sans-serif; font-weight:700;
  font-size:var(--step--1); letter-spacing:.14em; text-transform:uppercase;
  color:var(--unc-bolin-creek); margin:0 0 var(--space-2);
}
h1{
  font-family:"Libre Franklin",sans-serif; font-weight:800;
  font-size:var(--step-4); line-height:1.05; letter-spacing:-.02em;
  margin:0 0 var(--space-2);
}
.dek{color:var(--text-muted);margin:0;font-size:var(--step-0)}

/* Section headers use a rule + label, the way print does. */
.section-head{
  display:flex;align-items:baseline;gap:var(--space-4);
  margin:var(--space-7) 0 var(--space-4);
}
.section-head h2{
  font-family:"Libre Franklin",sans-serif;font-weight:700;
  font-size:var(--step-1);margin:0;white-space:nowrap;letter-spacing:-.01em;
}
.section-head .rule{flex:1;height:2px;background:var(--unc-carolina)}
.section-head .count{
  font-variant-numeric:tabular-nums;color:var(--text-muted);
  font-size:var(--step--1);font-weight:600;
}

/* A roster list, not a "card". Rules separate rows; no borders box it in. */
.roster{list-style:none;margin:0;padding:0}
.roster li{
  display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-4);
  align-items:center;padding:var(--space-4) 0;
  border-bottom:1px solid var(--unc-franklin-fog);
}
.roster li:last-child{border-bottom:0}
.avatar{
  width:44px;height:44px;border-radius:var(--radius-pill);
  object-fit:cover;background:var(--unc-cloud);
  /* The ring ties every avatar to the palette regardless of the photo. */
  box-shadow:0 0 0 2px var(--unc-white),0 0 0 4px var(--unc-carolina);
}
.who{min-width:0}
.name{font-weight:600;font-size:var(--step-0);margin:0}
.team{
  font-family:"Libre Franklin",sans-serif;font-weight:700;
  font-size:var(--step-1);letter-spacing:-.01em;margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.team.unset{color:var(--unc-flat-gray);font-weight:400;font-style:italic;font-size:var(--step-0)}
.badge{
  font-family:"Libre Franklin",sans-serif;font-size:var(--step--1);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--unc-navy);background:var(--unc-fordham);
  padding:2px var(--space-2);border-radius:var(--radius-sm);
}
.slot{
  font-variant-numeric:tabular-nums;color:var(--unc-flat-gray);
  font-family:"Libre Franklin",sans-serif;font-weight:700;font-size:var(--step-1);
}

/* Status: a text statement with a rule, not a pill floating in space. */
.status{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) 0;border-top:1px solid var(--unc-franklin-fog);
  margin-top:var(--space-6);font-size:var(--step--1);color:var(--text-muted);
}
.dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--status-ok);flex:none}
.status.is-stale .dot{background:var(--status-warn)}
.status strong{color:var(--text-strong);font-weight:600}
footer{padding:var(--space-7) 0 var(--space-8)}
</style></head>
<body>
<div class="masthead-band argyle-field argyle-field--band"></div>
<div class="wrap">
  <header>
    <p class="eyebrow">Fantasy Football &middot; <span id="season"></span> Season</p>
    <h1 id="league"></h1>
    <p class="dek"><span id="teams"></span> teams &middot; Draft pending</p>
  </header>

  <div class="section-head">
    <h2>The League</h2><span class="rule"></span><span class="count" id="count"></span>
  </div>
  <ul class="roster" id="roster"></ul>

  <div class="status"><span class="dot"></span>
    <span>Synced from Sleeper <strong>4 minutes ago</strong></span>
  </div>
  <footer></footer>
</div>
<script src="sample.js"></script>
<script>
const L = window.LEAGUE;
season.textContent = L.season; league.textContent = L.league;
teams.textContent = L.teams; count.textContent = L.members.length + " members";
roster.innerHTML = L.members.map((m,i) => `
  <li>
    <img class="avatar" src="${m.avatar}" alt="">
    <div class="who">
      <p class="name">${m.name}${m.owner ? ' <span class="badge">Commissioner</span>' : ''}</p>
      <p class="team ${m.team ? '' : 'unset'}">${m.team ?? 'Team name not set'}</p>
    </div>
    <span class="slot">${String(i+1).padStart(2,'0')}</span>
  </li>`).join("");
</script>
</body></html>

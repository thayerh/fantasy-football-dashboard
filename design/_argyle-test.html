<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="argyle.css">
<style>
 body{margin:0;font-family:system-ui;background:#fff}
 .row{display:flex;gap:0;height:200px}
 .row>*{flex:1}
 h3{font:600 13px system-ui;margin:16px 12px 6px;color:#13294B}
 .stripe-demo{background:#13294B;position:relative}
 .stripe-demo .argyle-stripe{position:absolute;left:24px;top:0;bottom:0;width:28px}
 .wm{height:200px;background:#fff;display:grid;place-items:center;color:#13294B;font:600 20px system-ui}
</style></head><body>
<h3>1. argyle-field (navy colourway) — full lattice with overstitch</h3>
<div class="row"><div class="argyle-field"></div></div>
<h3>2. argyle-field--light</h3>
<div class="row"><div class="argyle-field--light"></div></div>
<h3>3. argyle-stripe — uniform side panel, on navy</h3>
<div class="row"><div class="stripe-demo"><div class="argyle-stripe"></div></div></div>
<h3>4. argyle-watermark — oversized, low contrast, behind content</h3>
<div class="argyle-watermark wm">Content sits on top</div>
</body></html>
